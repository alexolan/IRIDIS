name: Build APK

# 出包线：手动触发 + 推 v* 标签时触发（构建并发布 Release）。
# 与仓库自带的 android.yml（push 触发的 debug 测试线）互不冲突。
#
# 2026-10-28 修复：上游 fetch-deps.sh 依赖的 MNN 预编译包
# （WWRJ3321/IRIDIS v2.0.0-beta Release 的 mnn-prebuilt-arm64.tar.gz）已被作者删除，
# 公开渠道无镜像（Releases API / Wayback 均已核实），导致 curl 404 / exit 22。
# 处理：full flavor 改走脚本自带的 --build-mnn 从源码重建（同 pinned commit + 补丁，
# 约 15-30 分钟，产物 third_party/mnn 进 actions/cache，后续构建零成本）；
# lite flavor 不链接 MNN（IRIS_MNN 仅 full 开启），冷缓存时直接剥离该下载块。
#
# 2026-10-28 修复 2（NDK 工具链对齐）：MNN 源码重建走 build-mnn-android.sh（硬要求 NDK
# r30），但 app 侧 ndkVersion 默认 r27c。r30 编出的目标文件引用 libc++ 新符号
# std::__ndk1::__hash_memory（NDK r28+ 才有），r27c 的 libc++_static.a 没有它，
# 链接 libiris_mnn.so 报 undefined symbol。处理：用 app/build.gradle.kts 官方支持的
# local.properties ndk.path 机制把 app native 构建也切到 r30，与 MNN 产物同工具链。
# 缓存 key 同时升 v3：失败 run 里重建的 MNN 因 cache 精确命中未被回存，
# v3 + restore-keys 让本轮重补 MNN 后的完整产物必定入缓存。

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '构建哪个 flavor（lite=仅 llama.cpp / full=+LiteRT-LM+MNN+GenieX）'
        type: choice
        options:
          - both
          - lite
          - full
        default: both
  push:
    tags:
      - 'v*'

permissions:
  contents: write # tag 构建时创建 Release 并上传 APK

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release APK (${{ inputs.flavor || 'both' }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 只装 r30：app 侧经 local.properties 的 ndk.path 也用 r30（与 MNN 重建同工具链，
      # 见文件头注释）；r27c 不再需要，若 ndk.path 机制失效会因缺 r27c 快速显式报错
      - name: Install SDK components (platform-35 / build-tools / NDK r30 / CMake / ninja)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;30.0.16248370" "cmake;3.22.1" > /dev/null

      - name: Cache pinned native deps (llama.cpp / MNN / QNN headers / sherpa AAR)
        uses: actions/cache@v4
        with:
          path: |
            third_party
            app/libs
          # v3：旧缓存条目只有 llama.cpp/sherpa/QNN（失败 run 里重建的 MNN 因精确命中未回存）；
          # 本轮 MNN 补齐后按 v3 key 回存。上游脚本变化时 restore-keys 自动复用最近的旧条目
          key: native-deps-v3-${{ hashFiles('scripts/fetch-deps.sh') }}
          restore-keys: native-deps-

      - name: Fetch pinned native deps (MNN source rebuild, upstream asset deleted)
        run: |
          FLAVOR="${{ inputs.flavor || 'both' }}"
          MNN_COMMIT="$(sed -n 's/^MNN_COMMIT="\(.*\)"$/\1/p' scripts/fetch-deps.sh | head -1)"
          if [ -f third_party/mnn/lib/arm64-v8a/libMNN.a ] && grep -q "$MNN_COMMIT" third_party/mnn/VERSION 2>/dev/null; then
            echo "MNN: present (cache)"
            sh scripts/fetch-deps.sh
          elif [ "$FLAVOR" != "lite" ]; then
            echo "MNN: 上游预编译包已 404，从源码重建（pinned $MNN_COMMIT，首次约 15-30 分钟）"
            echo "- MNN：源码重建（上游 v2.0.0-beta Release 资产已被删除）" >> "$GITHUB_STEP_SUMMARY"
            NDK="$ANDROID_HOME/ndk/30.0.16248370" sh scripts/fetch-deps.sh --build-mnn
            rm -rf build/mnn-src build/mnn-android   # 省磁盘：缓存只保留 third_party/mnn 产物
          else
            echo "MNN: lite 不链接 MNN（IRIS_MNN 仅 full flavor 开启），跳过"
            sed -i '/^# ---- MNN prebuilt/,/^# ---- QNN C API/{/^# ---- QNN C API/!d}' scripts/fetch-deps.sh
            sh -n scripts/fetch-deps.sh || { echo "fetch-deps.sh 结构已变化，需复查 MNN 跳过补丁" >&2; exit 1; }
            sh scripts/fetch-deps.sh
          fi
          # 关键产物断言：fetch 环节任何异常在这里显式失败，而不是拖到 gradle 里报模糊错误
          [ -f third_party/llama.cpp/CMakeLists.txt ] || { echo "assert fail: llama.cpp 缺失" >&2; exit 1; }
          ls app/libs/sherpa-onnx-*.aar > /dev/null 2>&1 || { echo "assert fail: sherpa AAR 缺失" >&2; exit 1; }
          [ -f third_party/qnn-api/include/QnnInterface.h ] || { echo "assert fail: QNN 头文件缺失" >&2; exit 1; }
          if [ "$FLAVOR" != "lite" ]; then
            [ -f third_party/mnn/lib/arm64-v8a/libMNN.a ] || { echo "assert fail: MNN lib 缺失" >&2; exit 1; }
          fi
          echo "native deps OK"

      # app/build.gradle.kts 只认项目根目录的 keystore.properties：
      #   - 配置了 4 个 secrets -> 用正式密钥签名（可覆盖安装此前发布的正式包）
      #   - 未配置 -> 生成一次性 debug 密钥签名，保证 APK 可直接安装（但每次 run 的签名不同，不可互相覆盖）
      - name: Set up signing (release keystore if configured, else CI debug key)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            printf '%s' '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 -d > release.keystore
            cat > keystore.properties <<'EOF'
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
            echo "SIGN_MODE=release" >> "$GITHUB_ENV"
          else
            KS="$HOME/.android/debug.keystore"
            mkdir -p "$(dirname "$KS")"
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cat > keystore.properties <<EOF
          storeFile=$KS
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
            echo "SIGN_MODE=debug" >> "$GITHUB_ENV"
          fi

      # 跳过 lintVital：lite 的 release lint 从未被上游 CI 验证过（android.yml 只跑
      # lintFullDebug），出包线以稳定产出 APK 为先；lint 质量门交给 android.yml。
      - name: Build release APK(s)
        run: |
          FLAVOR="${{ inputs.flavor || 'both' }}"
          case "$FLAVOR" in
            lite) TASKS="assembleLiteRelease" ;;
            full) TASKS="assembleFullRelease" ;;
            *)    TASKS="assembleLiteRelease assembleFullRelease" ;;
          esac
          # 工具链对齐（见文件头注释）：app native 也用 r30，与 MNN 重建产物同 libc++ ABI，
          # 否则链接 libiris_mnn.so 时报 __hash_memory 未定义符号。
          # ndk.path 是 app/build.gradle.kts 官方支持的机制（有则优先于 ndkVersion）
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.path=$ANDROID_HOME/ndk/30.0.16248370
          EOF
          echo "Building: $TASKS"
          ./gradlew $TASKS --no-daemon \
            -x lintVitalLiteRelease -x lintVitalFullRelease

      - name: Collect and rename APKs
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist
          shopt -s nullglob
          for apk in app/build/outputs/apk/*/release/*.apk; do
            flavor="$(basename "$(dirname "$(dirname "$apk")")")"
            ver="$("$BT/aapt" dump badging "$apk" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" | head -1)"
            [ -n "$ver" ] || ver="unknown"
            # lite -> IRIDIS-2.1.8.apk; full -> IRIDIS-2.1.8-full.apk（versionName 自带后缀）
            out="dist/IRIDIS-${ver}.apk"
            cp "$apk" "$out"
            size="$(du -h "$out" | cut -f1)"
            echo "- \`IRIDIS-${ver}.apk\`（flavor: ${flavor}，${size}）" >> "$GITHUB_STEP_SUMMARY"
          done
          if ! ls dist/*.apk > /dev/null 2>&1; then
            echo "No APK produced" >&2
            exit 1
          fi
          if [ "$SIGN_MODE" = "release" ]; then
            note="正式密钥签名（secrets 已配置）"
          else
            note="CI debug 密钥签名（未配置 ANDROID_KEYSTORE_BASE64 等 secrets；可安装，但每次构建签名不同，不可覆盖安装）"
          fi
          {
            echo ""
            echo "## IRIDIS APK 构建结果"
            echo ""
            echo "- 签名：${note}"
            echo "- 触发：${{ github.event_name }}（${GITHUB_REF_NAME}）"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          (cd dist && sha256sum *.apk > checksums.txt)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IRIDIS-apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" --clobber dist/*.apk dist/checksums.txt
          else
            gh release create "$tag" --title "IRIDIS $tag" --generate-notes \
              dist/*.apk dist/checksums.txt
          fi
